services:
  - type: web
    name: coincrest-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: "/opt/render/project/src:."
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENV
        value: production
